<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>桌游规则遗忘点卡片库 · 聚会主持台</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <main class="shell">
      <header class="topbar">
        <div>
          <p class="eyebrow">聚会前快速复习</p>
          <h1>桌游规则遗忘点卡片库</h1>
        </div>
        <div class="summary">
          <div>
            <span>收藏</span>
            <strong id="gameCount">0</strong>
          </div>
          <div>
            <span>遗忘点</span>
            <strong id="ruleCount">0</strong>
          </div>
          <div>
            <span>最久未玩</span>
            <strong id="staleGame">-</strong>
          </div>
        </div>
      </header>

      <section class="controls">
        <label>
          搜索
          <input id="searchInput" type="search" placeholder="游戏名或规则关键词" />
        </label>
        <label>
          人数
          <select id="playerFilter">
            <option value="all">全部</option>
            <option value="2">适合2人</option>
            <option value="3">适合3人</option>
            <option value="4">适合4人</option>
            <option value="5">适合5人</option>
          </select>
        </label>
        <label>
          复杂度
          <select id="complexityFilter">
            <option value="all">全部</option>
            <option value="轻">轻</option>
            <option value="中">中</option>
            <option value="重">重</option>
          </select>
        </label>
        <label>
          排序
          <select id="sortMode">
            <option value="stale">最近未玩</option>
            <option value="name">名称</option>
            <option value="complexity">复杂度</option>
          </select>
        </label>
      </section>

      <section class="layout">
        <aside class="panel">
          <h2>新增桌游</h2>
          <form id="gameForm" class="game-form">
            <label>
              名称
              <input id="nameInput" required placeholder="例：勃艮第城堡" />
            </label>
            <div class="split">
              <label>
                最少人数
                <input id="minPlayersInput" type="number" min="1" max="12" value="2" required />
              </label>
              <label>
                最多人数
                <input id="maxPlayersInput" type="number" min="1" max="12" value="4" required />
              </label>
            </div>
            <div class="split">
              <label>
                时长分钟
                <input id="durationInput" type="number" min="5" value="90" required />
              </label>
              <label>
                复杂度
                <select id="complexityInput">
                  <option value="轻">轻</option>
                  <option value="中" selected>中</option>
                  <option value="重">重</option>
                </select>
              </label>
            </div>
            <label>
              上次游玩
              <input id="lastPlayedInput" type="date" required />
            </label>
            <label>
              封面图
              <input id="coverInput" type="file" accept="image/*" />
            </label>
            <button class="primary" type="submit">加入收藏</button>
          </form>
        </aside>

        <section class="panel list-panel">
          <div class="panel-head">
            <h2>收藏列表</h2>
            <span id="visibleCount"></span>
          </div>
          <div id="gameList" class="game-list"></div>
        </section>

        <aside class="panel detail-panel">
          <div id="detailView"></div>
        </aside>
      </section>

      <section class="panel party-panel" id="partyPanel">
        <div class="panel-head">
          <div>
            <h2>聚会主持台</h2>
            <span>按人数与总时长自动编排多桌多局流程，可锁定、替换、拖拽微调，改动立即重排。</span>
          </div>
          <div class="party-actions">
            <button id="undoPartyBtn" type="button" disabled>撤销</button>
            <button id="redoPartyBtn" type="button" disabled>恢复</button>
            <button id="exportPartyBtn" type="button">导出方案</button>
            <button id="importPartyBtn" type="button">导入方案</button>
            <input id="importPartyInput" type="file" accept="application/json,.json" hidden />
          </div>
        </div>

        <form id="partyForm" class="party-form">
          <label>
            到场人数
            <input id="partyPlayersInput" type="number" min="1" max="99" required />
          </label>
          <label>
            总时长（分钟）
            <input id="partyMinutesInput" type="number" min="30" max="1440" step="15" required />
          </label>
          <label>
            开始时间
            <input id="partyStartInput" type="time" />
          </label>
          <label>
            复习重点
            <select id="partyFocusInput">
              <option value="forgets">容易忘的规则</option>
              <option value="disputes">常见争议</option>
              <option value="setup">开局准备</option>
              <option value="scoring">计分提醒</option>
            </select>
          </label>
          <button class="primary" type="submit">编排 / 重新编排</button>
        </form>

        <div class="party-adjust">
          <button id="lateAdjustBtn" type="button" title="以上面填写的新人数重排，保留当前方案为草稿">
            迟到/缺席，按新人数重排
          </button>
          <div class="insert-box">
            <select id="insertGameSelect"></select>
            <button id="insertGameBtn" type="button">中途插队加一局</button>
          </div>
          <button id="saveDraftBtn" type="button">当前方案存为草稿</button>
        </div>

        <p id="partyMessage" class="party-message" role="status"></p>
        <div id="partyOvertime" class="party-overtime" hidden></div>

        <div id="partyTimeline" class="party-timeline"></div>

        <section class="draft-box">
          <h3>草稿箱（调整前的方案自动保留在这里）</h3>
          <ul id="draftList" class="draft-list"></ul>
        </section>
      </section>
    </main>

    <script src="app.js"></script>
  </body>
</html>
